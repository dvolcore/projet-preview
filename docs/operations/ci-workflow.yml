name: Validate website and readiness tooling
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check JavaScript syntax and unit behavior
        run: |
          for file in js/*.js; do node --check "$file"; done
          node --test tests/*.test.cjs
      - name: Check SEO builder and evidence-validator fixtures
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Generate and audit an isolated preview package
        run: python3 scripts/build_seo.py --profile preview --config config/seo.example.json --output "$RUNNER_TEMP/projet-preview-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
